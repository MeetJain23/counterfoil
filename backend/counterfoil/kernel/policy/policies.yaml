# Counterfoil policy. This file is the whole of the agent's authority.
#
# Nothing the model proposes runs unless a clause here permits it, and every
# refusal below names itself in the audit ledger. Tuning recovery aggression
# means editing this file, not the code.
version: 2

global:
  # Below this confidence we will not spend money or contact anyone on the
  # strength of a diagnosis. Escalating to a human is always still allowed.
  min_confidence: 0.55
  # Recovering Rs 12 by spending Rs 20 of gateway fees and goodwill is a loss.
  min_recoverable_paise: 5000        # Rs 50
  # Hard stop across the entire lifecycle of one at-risk item.
  max_total_actions: 5

retry:
  max_attempts:
    payments: 3
    # Mandates legitimately retry across salary cycles, so they get one more.
    subscriptions: 4
    # An invoice is not a thing you retry.
    receivables: 0
  min_backoff_minutes: 30
  # When the issuer or gateway is down, retrying immediately just burns attempts.
  bank_outage_hold_minutes: 90
  # Insufficient funds is worth retrying, but on a human schedule, not a machine one.
  insufficient_funds_retry_after_hours: 24

contact:
  max_per_7d: 2
  # TRAI restricts commercial communication outside these hours. Also: nobody
  # recovers revenue by texting a customer at 3am.
  quiet_hours_start_ist: 21
  quiet_hours_end_ist: 9
  allowed_channels: [sms, email, whatsapp]

subscriptions:
  # NPCI e-mandate rules require the customer to be told before a recurring
  # debit is presented. This is not a courtesy and it is not a tunable:
  # presenting a mandate charge without notice is a compliance breach whether
  # or not it would have succeeded.
  require_pre_debit_notice: true
  pre_debit_notice_hours: 24
  # A mandate failing this many cycles in a row is not a collections problem
  # any more. Stop presenting it and put it in front of a person.
  escalate_after_consecutive_failures: 3

receivables:
  # A disputed invoice is a support problem, not a collections problem.
  # Dunning a dispute is how a recoverable account becomes a lost customer.
  block_dunning_when_disputed: true
  reminder_min_gap_days: 3
  escalate_after_days_overdue: 45
